name: Mirror to Deploy Repo
# preview
on:
  push:
    branches:
      - deploy
      - production
jobs:
  mirror:
    if: github.repository == 'HeirsHQ/e-invoicing-middleware'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Git
        run: |
          git config --local user.name "HT DevOps"
          git config --local user.email "platform-engineering@heirstechnologies.com"
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Add mirror remote
        run: |
          git remote add mirror git@github.com:${{ secrets.USERNAME }}/e-invoicing-middleware-mirror.git
      - name: Push to mirror
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git push mirror "$REF_NAME":"$REF_NAME" --force