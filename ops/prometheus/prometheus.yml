global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # E-invoicing API — submitted / accepted counters (and any API-side emits)
  - job_name: e-invoicing-api
    metrics_path: /metrics
    static_configs:
      # Local docker-compose: host.docker.internal
      # EC2: replace with private IP / internal DNS of the API instance(s)
      - targets:
          - host.docker.internal:3000
        labels:
          env: local
          component: api

  # Worker — processed success/failure + duration histogram
  - job_name: e-invoicing-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3002
        labels:
          env: local
          component: worker
